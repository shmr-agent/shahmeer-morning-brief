<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shahmeer Khan — Coming Soon</title>
  <meta name="description" content="Shahmeer Khan — coming soon.">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f7f8fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(100, 132, 255, 0.20), transparent 34%),
        radial-gradient(circle at bottom right, rgba(84, 223, 181, 0.16), transparent 30%),
        #0b1020;
    }

    main {
      width: min(680px, 100%);
      padding: 48px 40px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9fb0ff;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      font-size: 0.9rem;
      color: rgba(247,248,251,0.88);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #54dfb5;
      box-shadow: 0 0 18px rgba(84,223,181,0.75);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Shahmeer Khan</p>
    <h1>Coming soon</h1>
    <div class="status"><span class="dot" aria-hidden="true"></span>In development</div>
  </main>
</body>
</html>
